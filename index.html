<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Data · Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="40" height="40">
            <circle cx="20" cy="20" r="18" fill="#1a73e8"/>
            <path d="M20 4c-2.5 4-4 8-4 12s1.5 8 4 12c2.5-4 4-8 4-12s-1.5-8-4-12z" fill="#fff" opacity=".9"/>
            <path d="M6 14c5 1 10 1.5 14 1.5S29 15 34 14c-1 5-1.5 10-1.5 14S33 33 34 36c-5-1-10-1.5-14-1.5S11 35 6 36c1-5 1.5-10 1.5-14S7 15 6 14z" fill="#fff" opacity=".35"/>
            <circle cx="20" cy="20" r="5" fill="#fff"/>
          </svg>
        </div>
        <div>
          <h1>Football Data</h1>
          <p class="subtitle">Dashboard · football-data.org</p>
        </div>
      </div>

      <div class="header-right">
        <div class="fav-chip" id="favChip" hidden>
          <span class="fav-heart">♥</span>
          <img class="fav-crest" id="favCrest" alt="" />
          <span id="favName">—</span>
          <button type="button" class="fav-clear" id="favClear" title="Remover favorito">×</button>
        </div>

        <label class="select-wrap">
          <span>Competição</span>
          <select id="compSelect">
            <option value="BSA">🇧🇷 Brasileirão</option>
            <option value="PL">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</option>
            <option value="PD">🇪🇸 La Liga</option>
            <option value="SA">🇮🇹 Serie A</option>
            <option value="BL1">🇩🇪 Bundesliga</option>
            <option value="FL1">🇫🇷 Ligue 1</option>
            <option value="CL">🏆 Champions League</option>
            <option value="ELC">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Championship</option>
            <option value="DED">🇳🇱 Eredivisie</option>
            <option value="PPL">🇵🇹 Primeira Liga</option>
            <option value="WC">🌍 World Cup</option>
            <option value="EC">🇪🇺 Euro</option>
          </select>
        </label>
      </div>
    </header>

    <nav class="tabs" id="mainTabs">
      <button class="tab active" data-tab="standings">Tabela</button>
      <button class="tab" data-tab="scorers">Artilharia</button>
      <button class="tab" data-tab="matches">Jogos</button>
      <button class="tab" data-tab="teams">Times</button>
      <button class="tab" data-tab="trends">Forma</button>
      <button class="tab" data-tab="today">Hoje</button>
      <button class="tab" data-tab="search">Busca</button>
    </nav>

    <div class="status" id="status">
      <span class="spinner" hidden></span>
      <span id="statusText">Pronto</span>
    </div>

    <main class="content" id="content"></main>

    <div class="modal" id="modal" hidden>
      <div class="modal-backdrop" id="modalBackdrop"></div>
      <div class="modal-box">
        <button class="modal-close" id="modalClose" aria-label="Fechar">×</button>
        <div id="modalBody"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
