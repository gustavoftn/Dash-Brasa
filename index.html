<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel dos Campeonatos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --giz: #eef3ea; --papel: #fbfdf9; --tinta: #14231a; --suave: #5b6b60;
    --gramado: #1f6b3a; --linha: #cfdccb; --amarelo: #f2c230; --vermelho: #c93d3d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --giz: #0f1a13; --papel: #16241b; --tinta: #e8f0e4; --suave: #9bb0a1; --gramado: #4fb872; --linha: #27402f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--giz); color: var(--tinta); font: 16px/1.5 "Source Sans 3", system-ui, sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font: 800 clamp(2rem, 6vw, 3.4rem)/1 "Bricolage Grotesque", sans-serif; margin: 0 0 24px; letter-spacing: -0.02em; }
  .controles { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  select { font: inherit; padding: 8px 12px; border: 2px solid var(--tinta); border-radius: 8px; background: var(--papel); color: var(--tinta); }
  .abas { display: flex; gap: 4px; }
  .abas button { font: 600 1rem "Source Sans 3", sans-serif; padding: 8px 14px; border: 2px solid var(--tinta); background: transparent; color: var(--tinta); cursor: pointer; border-radius: 8px; }
  .abas button[aria-selected="true"] { background: var(--gramado); border-color: var(--gramado); color: #fff; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--amarelo); outline-offset: 2px; }
  .tabela { overflow-x: auto; background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  th { font-weight: 600; color: var(--suave); font-size: .9rem; }
  th:nth-child(2), td:nth-child(2) { text-align: left; width: 100%; }
  td.pos { text-align: center; font-weight: 600; width: 44px; border-left: 5px solid transparent; }
  tr.libertadores td.pos { border-left-color: var(--gramado); }
  tr.rebaixamento td.pos { border-left-color: var(--vermelho); }
  td.pts { font-weight: 800; }
  .time { display: inline-flex; align-items: center; gap: 10px; }
  .time img { width: 22px; height: 22px; object-fit: contain; }
  .grupo { margin: 24px 0 8px; font: 600 1.1rem "Bricolage Grotesque", sans-serif; }
  .legenda { color: var(--suave); font-size: .9rem; margin-top: 12px; }
  .jogo { display: grid; grid-template-columns: 90px 1fr auto 1fr; gap: 12px; align-items: center; padding: 12px; border-bottom: 1px solid var(--linha); }
  .jogo .data { color: var(--suave); font-size: .9rem; }
  .jogo .casa { justify-content: flex-end; text-align: right; }
  .jogo .x { color: var(--suave); }
  .msg { padding: 32px 16px; text-align: center; color: var(--suave); }
  @media (max-width: 560px) { .jogo { grid-template-columns: 1fr auto 1fr; } .jogo .data { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main>
  <h1>Painel dos campeonatos</h1>
  <div class="controles">
    <label class="sr" for="comp" style="position:absolute;left:-9999px">Campeonato</label>
    <select id="comp">
      <option value="BSA">Brasileirão Série A</option>
      <option value="PL">Premier League</option>
      <option value="PD">La Liga</option>
      <option value="SA">Serie A (Itália)</option>
      <option value="BL1">Bundesliga</option>
      <option value="FL1">Ligue 1</option>
      <option value="CL">Champions League</option>
    </select>
    <div class="abas" role="tablist">
      <button role="tab" data-tipo="standings" aria-selected="true">Classificação</button>
      <button role="tab" data-tipo="scorers" aria-selected="false">Artilheiros</button>
      <button role="tab" data-tipo="matches" aria-selected="false">Próximos jogos</button>
    </div>
  </div>
  <div id="conteudo" aria-live="polite"></div>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const crest = (u) => (u ? `<img src="${esc(u)}" alt="" loading="lazy">` : "");
let tipo = "standings";

const renders = {
  standings(d) {
    const grupos = (d.standings || []).filter((s) => s.type === "TOTAL");
    if (!grupos.length) return `<p class="msg">Sem classificação disponível.</p>`;
    const unico = grupos.length === 1;
    return grupos.map((g) => {
      const total = g.table.length;
      const linhas = g.table.map((l) => {
        const cls = unico && total >= 16 ? (l.position <= 4 ? "libertadores" : l.position > total - 4 ? "rebaixamento" : "") : "";
        return `<tr class="${cls}"><td class="pos">${l.position}</td>
          <td><span class="time">${crest(l.team.crest)}${esc(l.team.shortName || l.team.name)}</span></td>
          <td class="pts">${l.points}</td><td>${l.playedGames}</td><td>${l.won}</td><td>${l.draw}</td><td>${l.lost}</td>
          <td>${l.goalsFor}</td><td>${l.goalsAgainst}</td><td>${l.goalDifference}</td></tr>`;
      }).join("");
      return `${unico ? "" : `<div class="grupo">${esc(g.group || "")}</div>`}
        <div class="tabela"><table><thead><tr><th>#</th><th>Time</th><th>Pts</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th></tr></thead><tbody>${linhas}</tbody></table></div>`;
    }).join("") + (grupos.length === 1 ? `<p class="legenda">Verde: 4 primeiros. Vermelho: 4 últimos.</p>` : "");
  },
  scorers(d) {
    if (!d.scorers?.length) return `<p class="msg">Sem artilheiros disponíveis.</p>`;
    const linhas = d.scorers.map((s, i) => `<tr><td class="pos">${i + 1}</td>
      <td><span class="time">${crest(s.team.crest)}<span>${esc(s.player.name)} <span style="color:var(--suave)">${esc(s.team.shortName || s.team.name)}</span></span></span></td>
      <td class="pts">${s.goals}</td><td>${s.assists ?? "-"}</td><td>${s.penalties ?? "-"}</td><td>${s.playedMatches}</td></tr>`).join("");
    return `<div class="tabela"><table><thead><tr><th>#</th><th>Jogador</th><th>Gols</th><th>Assist.</th><th>Pên.</th><th>Jogos</th></tr></thead><tbody>${linhas}</tbody></table></div>`;
  },
  matches(d) {
    if (!d.matches?.length) return `<p class="msg">Nenhum jogo agendado no momento.</p>`;
    const fmt = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
    return `<div class="tabela">` + d.matches.slice(0, 15).map((m) => `<div class="jogo">
      <span class="data">${fmt.format(new Date(m.utcDate))}</span>
      <span class="time casa">${esc(m.homeTeam.shortName || m.homeTeam.name)}${crest(m.homeTeam.crest)}</span>
      <span class="x">x</span>
      <span class="time">${crest(m.awayTeam.crest)}${esc(m.awayTeam.shortName || m.awayTeam.name)}</span></div>`).join("") + `</div>`;
  },
};

async function carregar() {
  const comp = $("#comp").value;
  $("#conteudo").innerHTML = `<p class="msg">Carregando…</p>`;
  try {
    const r = await fetch(`/api/football?comp=${comp}&type=${tipo}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || d.error || "Erro ao carregar os dados.");
    $("#conteudo").innerHTML = renders[tipo](d);
  } catch (e) {
    $("#conteudo").innerHTML = `<p class="msg">${esc(e.message)} Tente outro campeonato ou volte em alguns minutos.</p>`;
  }
}

$("#comp").addEventListener("change", carregar);
document.querySelectorAll("[role=tab]").forEach((b) => b.addEventListener("click", () => {
  tipo = b.dataset.tipo;
  document.querySelectorAll("[role=tab]").forEach((x) => x.setAttribute("aria-selected", x === b));
  carregar();
}));
carregar();
</script>
</body>
</html>
